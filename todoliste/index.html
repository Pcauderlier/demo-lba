<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo liste</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="Main">

        <div class="headerForm">
            <h2>Ajouter un élément dans ma todo : </h2>
            <form id="create">
                <div class="group">
                    <label for="title">
                        Titre : 
                    </label>
                    <input id="title" type="text">
    
                </div>
                <div class="group">
                    <label for="description">
                        Description : 
                    </label>
                    <textarea id="description"></textarea>
                </div>
    
                <div class="group">
                    <label for="date">
                        Date : 
                    </label>
                    <input type="date" id="date">
                </div>
                <div class="group">
                    <input type="submit" value="Ajouter a ma todo">
    
                </div>
            </form>
        </div>
        
        
    
        <div class="list_head">
            <h2>Liste : </h2>
        </div>
        <div id="todo"></div>
    </div>



    <div class="popup hidden">
        <div class="headerForm container">
            <button class="close">X</button>
            <h2>Modifier l'élément</h2>
            <form id="modify">
                <input type="hidden" name="itemId" id="itemId">
                <div class="group">
                    <label for="title">
                        Titre : 
                    </label>
                    <input id="title" type="text">

                </div>
                <div class="group">
                    <label for="description">
                        Description : 
                    </label>
                    <textarea id="description"></textarea>
                </div>

                <div class="group">
                    <label for="date">
                        Date : 
                    </label>
                    <input type="date" id="date">
                </div>
                <div class="group">
                    <input type="submit" value="Modifier l'élément">

                </div>
                <input type="hidden" name="itemId">
                
            </form>
        </div>
    </div>
    <script src="./script.js"></script>

</body>
</html>
